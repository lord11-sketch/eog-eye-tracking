; PlatformIO project for the canonical acquisition firmware.
; Build:   pio run -d firmware
; Upload:  pio run -d firmware -t upload
; The sketch also opens directly in the Arduino IDE
; (firmware/eog_acquisition/eog_acquisition.ino, board "Arduino UNO R4 WiFi").

[platformio]
src_dir = eog_acquisition

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
